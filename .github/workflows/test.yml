name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: ffmpeg -hide_banner -version | head -1
      - run: git clone --quiet --depth 1 --branch v2026.11.19 https://github.com/viewgum/shortform-preflight "$RUNNER_TEMP/preflight"
      - run: node scripts/build.mjs --check
      - run: node test.mjs
        env:
          PREFLIGHT: ${{ runner.temp }}/preflight/bin/shortform-preflight.mjs
          REQUIRE_PREFLIGHT: "1"
